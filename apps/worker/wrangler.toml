[vars]
APP_ID = "path-of-mercenaries"
ALLOWED_ORIGINS = "http://localhost:5173,https://auth.dunhas.com,https://path-of-mercenaries.pages.dev,https://pom.dunhas.com"

[[d1_databases]]
binding = "DB"
database_name = "general-db"
